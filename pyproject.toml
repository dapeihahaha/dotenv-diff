[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dotenv-diff"
dynamic = ["version"]
description = "Compare .env against .env.example and catch missing, extra, and empty variables."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "dapeihahaha" }]
keywords = ["dotenv", "env", "config", "ci", "cli", "lint"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/dapeihahaha/dotenv-diff"
Issues = "https://github.com/dapeihahaha/dotenv-diff/issues"

[project.scripts]
dotenv-diff = "dotenv_diff.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dotenv_diff.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
